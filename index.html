<!DOCTYPE html>
<html>
<head>
    <title>Twitch Plushie Drop</title>
    <style>
        :root {
            --primary-color: #9146ff;
            --background-color: #18181b;
            --text-color: #efeff1;
            font-family: Roobert, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }

        #setup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 30px;
            background-color: var(--background-color);
            border: 1px solid var(--primary-color);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(145, 70, 255, 0.5);
            color: var(--text-color);
            text-align: center;
            z-index: 100;
        }

        #setup h1 {
            margin-top: 0;
            font-size: 1.5em;
        }

        #setup p {
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        #channel-input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #3a3a3d;
            color: var(--text-color);
            width: 200px;
            margin-bottom: 20px;
        }

        #connect-button {
            padding: 10px 20px;
            border: none;
            background-color: var(--primary-color);
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #connect-button:hover {
            background-color: #772ce8;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #score-display {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px black;
            z-index: 10;
        }

        .floating-text {
            position: absolute;
            color: #ffd700;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            animation: floatUp 2s forwards;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes floatUp {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-50px);
            }
        }
    </style>
</head>
<body>

<div id="setup">
    <h1>Plushie Drop Overlay</h1>
    <p>Enter your Twitch channel name to begin.</p>
    <input type="text" id="channel-input" placeholder="e.g., twitchpresents">
    <br>
    <button id="connect-button">Connect</button>
</div>

<div id="game-container" style="display: none;">
    <canvas id="game-canvas"></canvas>
    <div id="score-display">Score: 0</div>
</div>

<script type="importmap">
    {
      "imports": {
        "tmi.js": "https://cdn.jsdelivr.net/npm/tmi.js/dist/tmi.esm.js",
        "matter-js": "https://cdn.skypack.dev/matter-js"
      }
    }
</script>

<script type="module">
    import tmi from 'tmi.js';
    import Matter from 'matter-js';

    // --- DOM Elements ---
    const setupDiv = document.getElementById('setup');
    const connectButton = document.getElementById('connect-button');
    const channelInput = document.getElementById('channel-input');
    const gameContainer = document.getElementById('game-container');
    const scoreDisplay = document.getElementById('score-display');
    const canvas = document.getElementById('game-canvas');

    // --- Game State ---
    let score = 0;
    let twitchClient;

    // --- Sound Assets ---
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const sounds = {};
    async function loadSound(name, url) {
        try {
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            sounds[name] = audioBuffer;
        } catch(e) {
            console.error(`Failed to load sound ${name}:`, e);
        }
    }
    loadSound('drop', './drop.mp3');
    loadSound('score', './score.mp3');
    loadSound('bounce', './bounce.mp3');

    function playSound(name, volume = 1.0) {
        if (!sounds[name] || audioContext.state === 'suspended') return;
        const source = audioContext.createBufferSource();
        source.buffer = sounds[name];
        const gainNode = audioContext.createGain();
        gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
        source.connect(gainNode);
        gainNode.connect(audioContext.destination);
        source.start(0);
    }

    // --- Matter.js Setup ---
    const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;
    const engine = Engine.create();
    const world = engine.world;
    world.gravity.y = 0.6;

    let render;

    function setupPhysics() {
        const width = window.innerWidth;
        const height = window.innerHeight;

        canvas.width = width;
        canvas.height = height;

        render = Render.create({
            canvas: canvas,
            engine: engine,
            options: {
                width: width,
                height: height,
                background: 'transparent',
                wireframes: false
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // --- Create World Objects ---
        const targetPlatform = Bodies.rectangle(width / 2, height - 50, 200, 40, {
            isStatic: true,
            label: 'target',
            render: { sprite: { texture: './target.png', xScale: 0.5, yScale: 0.5 } }
        });

        // Add some pegs
        const pegRows = 5;
        const pegCols = 7;
        for (let row = 0; row < pegRows; row++) {
            for (let col = 0; col < pegCols; col++) {
                let x = (width / (pegCols + 1)) * (col + 1);
                if (row % 2 !== 0) {
                    x -= width / (pegCols + 1) / 2;
                }
                const y = 150 + row * 100;
                const peg = Bodies.circle(x, y, 15, {
                    isStatic: true,
                    label: 'peg',
                    restitution: 0.8,
                    render: { sprite: { texture: './peg.png', xScale: 0.5, yScale: 0.5 } }
                });
                Composite.add(world, peg);
            }
        }
        
        // Invisible walls
        const wallThickness = 100;
        Composite.add(world, [
            targetPlatform,
            Bodies.rectangle(-wallThickness/2, height/2, wallThickness, height, { isStatic: true, render: { visible: false } }),
            Bodies.rectangle(width + wallThickness/2, height/2, wallThickness, height, { isStatic: true, render: { visible: false } })
        ]);

    }

    // --- Game Logic ---
    function dropPlushie(user) {
        playSound('drop');
        const width = window.innerWidth;
        const x = width * 0.2 + Math.random() * width * 0.6;
        const plushie = Bodies.rectangle(x, -50, 64, 64, {
            restitution: 0.5,
            angle: Math.random() * Math.PI * 2,
            label: 'plushie',
            render: {
                sprite: {
                    texture: './plushie.png',
                    xScale: 0.5,
                    yScale: 0.5
                }
            },
            customData: { user }
        });
        Body.setAngularVelocity(plushie, (Math.random() - 0.5) * 0.2);
        Composite.add(world, plushie);
    }
    
    function showFloatingText(text, x, y) {
        const textEl = document.createElement('div');
        textEl.className = 'floating-text';
        textEl.innerText = text;
        textEl.style.left = `${x}px`;
        textEl.style.top = `${y}px`;
        gameContainer.appendChild(textEl);
        setTimeout(() => textEl.remove(), 2000);
    }

    function updateScore(amount) {
        score += amount;
        scoreDisplay.textContent = `Score: ${score}`;
    }

    function setupCollisionEvents() {
        Events.on(engine, 'collisionStart', (event) => {
            for (const pair of event.pairs) {
                const { bodyA, bodyB } = pair;
                const labels = [bodyA.label, bodyB.label];

                if (labels.includes('plushie') && labels.includes('target')) {
                    const plushie = labels[0] === 'plushie' ? bodyA : bodyB;
                    // Prevent multiple scores from one plushie
                    if (!plushie.customData.scored) {
                        plushie.customData.scored = true;
                        playSound('score');
                        updateScore(100);
                        const user = plushie.customData.user;
                        const x = plushie.position.x;
                        const y = plushie.position.y;
                        showFloatingText(`+100 ${user}!`, x, y);
                    }
                } else if (labels.includes('plushie') && labels.includes('peg')) {
                    playSound('bounce', 0.5);
                }
            }
        });
    }
    
    // Clean up plushies that fall off screen
    setInterval(() => {
        const bodiesToRemove = world.bodies.filter(body => body.label === 'plushie' && body.position.y > window.innerHeight + 100);
        bodiesToRemove.forEach(body => Composite.remove(world, body));
    }, 5000);


    // --- Twitch Integration ---
    function connectToTwitch(channel) {
        if (twitchClient) {
            twitchClient.disconnect();
        }

        twitchClient = new tmi.Client({
            options: { debug: false }, // Set to true for more verbose connection logs
            connection: {
                reconnect: true,
                secure: true
            },
            channels: [channel]
        });

        twitchClient.connect().catch(err => {
            console.error("Failed to connect to Twitch:", err);
            alert(`Could not connect to channel "${channel}". Please check the name and try again.`);
            // Show setup screen again
            setupDiv.style.display = 'block';
            gameContainer.style.display = 'none';
        });

        twitchClient.on('message', (channel, tags, message, self) => {
            if (self) return;
            // Only respond to !drop commands
            if (message.toLowerCase().trim() === '!drop') {
                const username = tags['display-name'] || 'Someone';
                dropPlushie(username);
            }
        });

        twitchClient.on('connected', (address, port) => {
            console.log(`Successfully connected to Twitch channel: ${channel}`);
        });
    }

    // --- UI Event Handlers ---
    connectButton.addEventListener('click', () => {
        const channel = channelInput.value.trim().toLowerCase();
        if (!channel) {
            alert('Please enter a channel name.');
            return;
        }

        // On first click, allow audio context to start
        if (audioContext.state === 'suspended') {
            audioContext.resume();
        }

        setupDiv.style.display = 'none';
        gameContainer.style.display = 'block';

        if (!render) { // First time setup
            setupPhysics();
            setupCollisionEvents();
        }

        connectToTwitch(channel);
    });

</script>

</body>
</html>
